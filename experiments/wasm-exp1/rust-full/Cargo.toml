[package]
name = "jadpo-wasm-exp1-rust-full"
version = "0.0.0"
edition = "2021"
rust-version = "1.78"
publish = false

[lib]
path = "build/generated.rs"
crate-type = ["cdylib"]

[dependencies]
serde_json = "=1.0.133"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
