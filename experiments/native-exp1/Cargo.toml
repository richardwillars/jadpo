[package]
name = "jadpo-native-exp1"
version = "0.0.0"
edition = "2021"
rust-version = "1.78"
publish = false

[dependencies]
serde_json = "=1.0.133"
rusqlite = "=0.32.1"
hyper = { version = "=0.14.27", features = ["server", "http1", "tcp"] }
tokio = { version = "=1.34.0", features = ["rt", "macros", "net", "time"] }
libc = "=0.2.169"

[features]
vector = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
